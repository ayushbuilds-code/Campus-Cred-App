services:
  - type: web
    name: campuscred
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node apps/api/src/seed.js && node apps/api/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
    disk:
      name: campuscred-data
      mountPath: /app/apps/api/data
      sizeGB: 1
